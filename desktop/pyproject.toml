[project]
name = "ollie-reader-desktop"
version = "0.4.0"
description = "Ollie Reader desktop shell: PySide6 tray + local FastAPI sidecar (Piper/Kokoro TTS, PDF extraction)"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "starlette>=1.3.1",
    "python-multipart",
    "uvicorn[standard]",
    "pymupdf",
    "piper-tts",
    "soundfile",
    "numpy",
    # Kokoro via ONNX Runtime (no PyTorch). Pulls onnxruntime + phonemizer-fork
    # + espeakng-loader for G2P. Model/voices files live in models/ (bundled).
    "kokoro-onnx",
    "PySide6",
    # outbound HTTP client for /api/fetch-url (URL proxy, e.g. remote PDFs) and
    # for the settings window's TTS audition tab talking to the local sidecar.
    "httpx",
    "keyring",
    # Edge TTS (/api/etts): CLOUD engine, needs network, no API key. Pure Python
    # (aiohttp), no model files — the lightest engine in the bundle.
    # Licence: LGPL-3.0 (7.2.8 ships LICENSE saying LGPLv3 for everything except
    # srt_composer.py, which is MIT). Weak copyleft, so bundling it in the MIT
    # .app is fine as long as the notice + licence copy ship with the release.
    # Fragile by nature: relies on a Sec-MS-GEC token that Microsoft rotates on
    # Edge release cycles; a stale one means HTTP 403 until this pin is bumped.
    "edge-tts",
]

[dependency-groups]
dev = [
    "pytest",
    "pyinstaller",
]
# Optional Azure AI Speech SDK for /api/azure-tts. Serves the SAME neural voices
# as edge-tts but through the official, key-authenticated endpoint — and unlike
# edge-tts (which hardcodes 24kHz/48kbps mono mp3) it lets us pick the output
# format, which matters for sibilance. Kept out of the default sync because it
# ships a native binary and most users won't have a subscription key. Opt in with
# `uv sync --group azure`. The key/region are entered by the user in the settings
# window and stored in the OS keychain (server/tts_secrets.py) — never bundled.
azure = [
    "azure-cognitiveservices-speech",
]

# This is a run-from-source app (main.py + server/ + shell/), not an installable
# distribution, so uv manages only the environment — it does not build the project.
[tool.uv]
package = false


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
